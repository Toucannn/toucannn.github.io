name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: daylength/package-lock.json

      - name: Install
        run: npm ci
        working-directory: daylength

      - name: Build
        run: npm run build
        working-directory: daylength

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site

          # 1) Copy existing static site structure from repo root into _site/
          # Exclude folders you do NOT want to publish (source code, workflows, build staging)
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'daylength/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            ./ _site/

          # 2) Put the built Vue app under /daylength/
          mkdir -p _site/daylength
          cp -r daylength/dist/* _site/daylength/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4